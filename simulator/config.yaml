# Camera Streaming Simulator Configuration
# Hall 101 only — 2 camera angles and 2 microphones

cameras:
  hall101_cam_front:
    video_path: /app/videos/cam1.mp4
    fps: 30
    resolution: [1280, 720]

  hall101_cam_back:
    video_path: /app/videos/cam2.mp4
    fps: 30
    resolution: [1280, 720]

mics:
  hall101_mic_front:
    audio_path: /app/videos/front_audio.m4a
    sample_rate: 16000
    chunk_ms: 500

  hall101_mic_back:
    audio_path: /app/videos/back_audio.mp3
    sample_rate: 16000
    chunk_ms: 500

# Server settings
server:
  host: 0.0.0.0
  port: 8000
  # Quality for MJPEG streaming (1-100)
  jpeg_quality: 85
  # Frame skip for bandwidth control (1 = every frame, 2 = every 2nd frame)
  frame_skip: 1
